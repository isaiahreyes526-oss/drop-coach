services:
  - type: web
    name: drop-coach-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: API_ACCESS_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: FRONTEND_ORIGIN
        value: "*"